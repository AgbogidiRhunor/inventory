{% extends "inventory/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <h1 class="login-title">📦 Stock Tracker</h1>
        <p class="login-subtitle">Sign in to manage your inventory</p>

        {% if form.errors %}
            <div class="message message-error">Invalid username or password.</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus>

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
